[app:main]
use = call:simulate_pyramid.app:main
pyramid.reload_templates = true

# Conductor/Celery
conductor.server_url = http://localhost:8080
celery.broker_url = redis://localhost:6379/0
celery.result_backend = redis://localhost:6379/1

# Kafka (optional)
kafka.enabled = true
kafka.bootstrap_servers = kafka:9093
kafka.topics = dev-events

[server:main]
use = egg:pyramid#wsgiref
host = 0.0.0.0
port = 6543

