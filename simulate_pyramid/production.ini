[app:main]
use = call:simulate_pyramid.app:main
pyramid.reload_templates = false

# Conductor/Celery
conductor.server_url = https://conductor.example.com
celery.broker_url = redis://redis:6379/0
celery.result_backend = redis://redis:6379/1

# Kafka (optional)
kafka.enabled = false
kafka.bootstrap_servers = kafka:9092
kafka.topics = prod-events

[server:main]
use = egg:waitress#main
listen = 0.0.0.0:6543

